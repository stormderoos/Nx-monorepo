name: Build and deploy a Node.js app and an Angular app to Azure

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and zip apps from /dist
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies and build
        run: |
          npm install --legacy-peer-deps
          npm run build:data-api
          npm run build:my-app

      - name: Zip backend for deployment
        run: |
          cd dist/apps/data-api
          zip -r ../../../data-api-release.zip .

      - name: Zip frontend for deployment
        run: |
          cd dist/apps/my-app
          zip -r ../../my-app-release.zip .

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: my-app-release.zip

      - name: Upload NestJS artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-api
          path: data-api-release.zip

  deploy-my-app:
    runs-on: ubuntu-latest
    name: Deploy Angular Frontend
    needs: build
    environment:
      name: 'Production'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-app

      - run: unzip my-app-release.zip

      - name: Deploy Angular to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ANGULAR_PUBLISHTOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: 'dist/apps/my-app'

  deploy-data-api:
    runs-on: ubuntu-latest
    name: Deploy NestJs data-api backend
    needs: build
    environment:
      name: 'Production'
      
    steps:
        - name: Download artifact from build job
          uses: actions/download-artifact@v4
          with:
            name: data-api
      
        - name: Unzip artifact for deployment
          run: unzip data-api-release.zip
      
        - name: Install dependencies
          run: npm install --legacy-peer-deps
      
        - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v3
          with:
            app-name: 'nx-worskhop-nestjs'
            slot-name: 'Production'
            publish-profile: ${{ secrets.DATA_API_PUBLISHPROFILE }}
            package: .