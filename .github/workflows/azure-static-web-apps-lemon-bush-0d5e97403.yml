name: Build and deploy a Node.js app and an Angular app to an Azure

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and zip apps from /dist
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm install

      - name: Build Angular and NestJS apps
        run: |
          npm run build:data-api
          npm run build:my-app
          
      - name: Create package.json for Azure
        run: |
          echo '{
            "name": "data-api",
            "version": "0.0.1",
            "main": "main.js",
            "scripts": {
              "start": "node main.js"
            }
          }' > dist/apps/data-api/package.json

      - name: Zip NestJS backend for deployment
        run: |
            cd dist/apps/data-api
            zip -r ../../../data-api-release.zip .

      - name: Zip Angular frontend for deployment
        run: |
          cd dist/apps/my-app
          cp ../../../../package.json .
          zip -r ../../my-app-release.zip .

      - name: Upload my-app artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: dist/my-app-release.zip

      - name: Upload data-api artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: data-api
          path: data-api-release.zip

  deploy-my-app:
    runs-on: ubuntu-latest
    name: Deploy Angular Frontend
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: my-app

      - name: Unzip artifact for deployment
        run: unzip my-app-release.zip -d .

      - name: Deploy to static azure web app
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ANGULAR_PUBLISHTOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/' 
          api_location: ''
          output_location: 'dist/apps/my-app'

  deploy-data-api:
    runs-on: ubuntu-latest
    name: Deploy NestJs data-api backend
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: data-api

      - name: Unzip artifact for deployment
        run: unzip data-api-release.zip

      - name: Wait before deploy to avoid SCM conflict
        run: sleep 15

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nx-worskhop-nestjs'
          slot-name: 'Production'
          publish-profile: ${{ secrets.DATA_API_PUBLISHPROFILE }}
          package: .
          clean: true