<div *ngIf="loadingClubs" class="loader">Loading clubs...</div>
<div *ngIf="loadingPlayers" class="loader">Loading players...</div>
<div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

<form [formGroup]="matchForm" (ngSubmit)="onSubmit()">
  <!-- Select Home Team -->
  <div class="form-group">
    <label for="homeTeamId">Home Team:</label>
    <select id="homeTeamId" formControlName="homeTeamId" (change)="loadPlayersForTeam('home')" required>
      <option *ngFor="let club of clubs" [value]="club._id">{{ club.name }}</option>
    </select>
  </div>

  <!-- Select Away Team -->
  <div class="form-group">
    <label for="awayTeamId">Away Team:</label>
    <select id="awayTeamId" formControlName="awayTeamId" (change)="loadPlayersForTeam('away')" required>
      <option *ngFor="let club of clubs" [value]="club._id">{{ club.name }}</option>
    </select>
  </div>

  <!-- Scores -->
  <div class="form-group">
    <label for="homeScore">Home Score:</label>
    <input id="homeScore" formControlName="homeScore" type="number" min="0">
  </div>

  <div class="form-group">
    <label for="awayScore">Away Score:</label>
    <input id="awayScore" formControlName="awayScore" type="number" min="0">
  </div>

  <!-- Select Scorers -->
  <div class="form-group">
    <label for="scorers">Select Scorers:</label>
    <select id="scorers" formControlName="scorers" multiple (change)="onScorersChange($event)">
      <option *ngFor="let player of homePlayers" [value]="player._id">
        {{ player.firstName }} {{ player.lastName }}
      </option>
      <option *ngFor="let player of awayPlayers" [value]="player._id">
        {{ player.firstName }} {{ player.lastName }}
      </option>
    </select>
  </div>

  <!-- Select Assisters -->
  <div class="form-group">
    <label for="assisters">Select Assisters:</label>
    <select id="assisters" formControlName="assisters" multiple (change)="onAssistersChange($event)">
      <option *ngFor="let player of homePlayers" [value]="player._id">
        {{ player.firstName }} {{ player.lastName }}
      </option>
      <option *ngFor="let player of awayPlayers" [value]="player._id">
        {{ player.firstName }} {{ player.lastName }}
      </option>
    </select>
  </div>

  <button type="submit" [disabled]="loadingPlayers || matchForm.invalid">Update Match</button>
</form>
