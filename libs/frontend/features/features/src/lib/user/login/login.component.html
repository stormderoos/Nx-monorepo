<div class="login-container">
  <h2>Inloggen</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- E-mail -->
    <div class="form-group">
      <label for="email">E-mailadres</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="form-control"
        [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        placeholder="Voer je e-mailadres in"
      />
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="invalid-feedback">
        Voer een geldig e-mailadres in.
      </div>
    </div>

    <!-- Wachtwoord -->
    <div class="form-group">
      <label for="password">Wachtwoord</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="form-control"
        [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        placeholder="Voer je wachtwoord in"
      />
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="invalid-feedback">
        Wachtwoord is verplicht.
      </div>
    </div>

    <!-- Foutmelding -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <!-- Inlogknop -->
    <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || loading">
      {{ loading ? 'Even geduld...' : 'Inloggen' }}
    </button>
  </form>
</div>
